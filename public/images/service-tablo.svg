<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgTablo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgTablo)"/>
  <!-- Instrument Cluster Dashboard Frame -->
  <rect x="150" y="80" width="500" height="300" rx="40" fill="#020617" stroke="#334155" stroke-width="4"/>
  <!-- Left Dial: Tachometer (Оборотомер) -->
  <circle cx="270" cy="220" r="85" fill="#0F172A" stroke="#1E293B" stroke-width="8"/>
  <circle cx="270" cy="220" r="80" fill="none" stroke="#0D9488" stroke-dasharray="4 8" stroke-width="3"/>
  <line x1="270" y1="220" x2="220" y2="170" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="270" cy="220" r="10" fill="#EF4444"/>
  <text x="270" y="270" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">RPM x1000</text>
  <!-- Right Dial: Speedometer (Километраж) -->
  <circle cx="530" cy="220" r="85" fill="#0F172A" stroke="#1E293B" stroke-width="8"/>
  <circle cx="530" cy="220" r="80" fill="none" stroke="#0D9488" stroke-dasharray="4 8" stroke-width="3"/>
  <line x1="530" y1="220" x2="570" y2="170" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="530" cy="220" r="10" fill="#EF4444"/>
  <text x="530" y="270" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">km/h</text>
  <!-- Center LCD / FIS Display -->
  <rect x="365" y="160" width="70" height="110" rx="6" fill="#042F2E" stroke="#14B8A6" stroke-width="2"/>
  <text x="400" y="195" fill="#5EEAD4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">OK</text>
  <text x="400" y="225" fill="#FCD34D" font-family="monospace" font-size="10" text-anchor="middle">182,450 km</text>
  <text x="400" y="250" fill="#5EEAD4" font-family="monospace" font-size="9" text-anchor="middle">21.5°C</text>
  <!-- Cluster Repair Title -->
  <rect x="220" y="420" width="360" height="40" rx="20" fill="#0F766E"/>
  <text x="400" y="445" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">РЕМОНТ НА АВТОМОБИЛНИ ТАБЛА И ДИСПЛЕИ</text>
</svg>
