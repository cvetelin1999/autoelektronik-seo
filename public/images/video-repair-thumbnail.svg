<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#vidBg)"/>
  <!-- Motherboard Circuit Grid Background -->
  <g stroke="#1E293B" stroke-width="2">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>
  <!-- Huge Play Button Icon in Center -->
  <circle cx="640" cy="340" r="70" fill="#0F766E" stroke="#2DD4BF" stroke-width="6"/>
  <polygon points="620,300 680,340 620,380" fill="#FFFFFF"/>
  <!-- Video Duration Badge -->
  <rect x="1100" y="630" width="120" height="46" rx="10" fill="#020617" opacity="0.9"/>
  <text x="1160" y="660" fill="#F8FAFC" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">04:35</text>
  <!-- Video Header Banner -->
  <rect x="100" y="80" width="400" height="44" rx="8" fill="#0F766E"/>
  <text x="300" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ВИДЕО РЪКОВОДСТВО И ДИАГНОСТИКА</text>
  <!-- Video Main Title -->
  <text x="640" y="470" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">Как се ремонтира и рециклира дефектирал ABS / ESP модул</text>
  <text x="640" y="520" fill="#99F6E4" font-family="sans-serif" font-size="20" text-anchor="middle">Лабораторен процес: микрозапояване на прекъснати бондинг нишки (ATE MK60 / Bosch 8.0)</text>
</svg>
