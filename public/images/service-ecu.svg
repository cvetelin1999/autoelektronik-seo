<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgEcu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgEcu)"/>
  <!-- Metallic ECU Housing Outline -->
  <rect x="200" y="80" width="400" height="320" rx="24" fill="#1E293B" stroke="#475569" stroke-width="6"/>
  <!-- Heat Sink Fins -->
  <line x1="240" y1="80" x2="240" y2="400" stroke="#334155" stroke-width="4"/>
  <line x1="280" y1="80" x2="280" y2="400" stroke="#334155" stroke-width="4"/>
  <line x1="520" y1="80" x2="520" y2="400" stroke="#334155" stroke-width="4"/>
  <line x1="560" y1="80" x2="560" y2="400" stroke="#334155" stroke-width="4"/>
  <!-- Multi-pin Automotive Connector -->
  <rect x="140" y="180" width="60" height="120" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
  <circle cx="160" cy="205" r="4" fill="#F59E0B"/>
  <circle cx="180" cy="205" r="4" fill="#F59E0B"/>
  <circle cx="160" cy="225" r="4" fill="#F59E0B"/>
  <circle cx="180" cy="225" r="4" fill="#F59E0B"/>
  <circle cx="160" cy="245" r="4" fill="#F59E0B"/>
  <circle cx="180" cy="245" r="4" fill="#F59E0B"/>
  <circle cx="160" cy="265" r="4" fill="#F59E0B"/>
  <circle cx="180" cy="265" r="4" fill="#F59E0B"/>
  <!-- Main Processor (Bosch/Infineon TriCore) -->
  <rect x="330" y="160" width="140" height="140" rx="8" fill="#042F2E" stroke="#14B8A6" stroke-width="3"/>
  <rect x="360" y="190" width="80" height="80" rx="4" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
  <text x="400" y="225" fill="#5EEAD4" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TriCore™</text>
  <text x="400" y="245" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">MED17 / EDC17</text>
  <!-- Flash & EEPROM Chips -->
  <rect x="310" y="320" width="70" height="40" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="345" y="345" fill="#FCD34D" font-family="sans-serif" font-size="9" text-anchor="middle">EEPROM</text>
  <rect x="420" y="320" width="70" height="40" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="455" y="345" fill="#FCD34D" font-family="sans-serif" font-size="9" text-anchor="middle">FLASH</text>
  <!-- Service Badge -->
  <rect x="230" y="425" width="340" height="40" rx="20" fill="#0F766E"/>
  <text x="400" y="450" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">РЕМОНТ НА ECU ДВИГАТЕЛЕН КОМПЮТЪР</text>
</svg>
