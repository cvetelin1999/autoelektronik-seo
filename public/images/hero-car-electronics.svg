<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#heroBg)"/>
  <!-- Modern Vehicle Electronic Wireframe Silhouette -->
  <path d="M100 420 C180 420, 220 380, 260 300 C300 220, 480 200, 560 260 C640 320, 680 420, 720 420" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- Front Wheel Hub (ABS Sensor Ring) -->
  <circle cx="240" cy="420" r="50" fill="#042F2E" stroke="#5EEAD4" stroke-width="3"/>
  <circle cx="240" cy="420" r="25" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="240" y="424" fill="#F59E0B" font-family="sans-serif" font-size="9" text-anchor="middle">ABS</text>
  <!-- Rear Wheel Hub -->
  <circle cx="620" cy="420" r="50" fill="#042F2E" stroke="#5EEAD4" stroke-width="3"/>
  <circle cx="620" cy="420" r="25" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="620" y="424" fill="#F59E0B" font-family="sans-serif" font-size="9" text-anchor="middle">ABS</text>
  <!-- Engine ECU Node -->
  <rect x="280" y="270" width="80" height="60" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="320" y="305" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ECU</text>
  <!-- Instrument Cluster Node -->
  <rect x="420" y="240" width="70" height="50" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="455" y="270" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ТАБЛО</text>
  <!-- OBD2 Gateway Node -->
  <rect x="440" y="320" width="60" height="40" rx="6" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
  <text x="470" y="345" fill="#F43F5E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OBD-II</text>
  <!-- High Speed CAN Bus Interconnects -->
  <line x1="360" y1="300" x2="420" y2="265" stroke="#FCD34D" stroke-width="3"/>
  <line x1="320" y1="330" x2="240" y2="395" stroke="#FCD34D" stroke-width="2"/>
  <line x1="470" y1="290" x2="470" y2="320" stroke="#FCD34D" stroke-width="2"/>
  <line x1="500" y1="340" x2="620" y2="395" stroke="#FCD34D" stroke-width="2"/>
  <!-- Diagnostic pulses -->
  <circle cx="390" cy="282" r="5" fill="#FFFFFF"/>
  <!-- Hero Caption -->
  <text x="400" y="520" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ЦЯЛОСТНА ЕЛЕКТРОННА СИСТЕМА И CAN-BUS</text>
  <text x="400" y="550" fill="#99F6E4" font-family="sans-serif" font-size="13" text-anchor="middle">Прецизна лабораторна диагностика и ремонт на блокове за управление</text>
</svg>
