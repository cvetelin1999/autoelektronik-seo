<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgAbs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgAbs)"/>
  <!-- Circuit Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- ABS Hydraulic Block Outline -->
  <rect x="220" y="110" width="360" height="280" rx="20" fill="#1E293B" stroke="#0F766E" stroke-width="4"/>
  <!-- Aluminum Hydraulic Valve Ports -->
  <circle cx="280" cy="170" r="24" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="360" cy="170" r="24" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="440" cy="170" r="24" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="520" cy="170" r="24" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <!-- ABS Microcontroller Board & Traces -->
  <rect x="270" y="240" width="260" height="110" rx="10" fill="#042F2E" stroke="#14B8A6" stroke-width="2"/>
  <rect x="370" y="270" width="60" height="50" rx="4" fill="#0F172A" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="400" y="300" fill="#5EEAD4" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ATE / Bosch</text>
  <!-- Solder bonding wires -->
  <path d="M300 270 Q 330 250 370 280" stroke="#F59E0B" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M300 290 Q 330 280 370 295" stroke="#F59E0B" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M500 270 Q 470 250 430 280" stroke="#F59E0B" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M500 290 Q 470 280 430 295" stroke="#F59E0B" stroke-width="2" fill="none" filter="url(#glow)"/>
  <!-- Title Badge -->
  <rect x="250" y="420" width="300" height="40" rx="20" fill="url(#accentTeal)"/>
  <text x="400" y="445" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">РЕМОНТ НА ABS/ESP МОДУЛ</text>
</svg>
