<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#flowBg)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Step 1 -->
  <rect x="50" y="180" width="180" height="140" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
  <circle cx="140" cy="180" r="22" fill="#0F766E"/>
  <text x="140" y="186" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="140" y="235" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Симптом</text>
  <text x="140" y="265" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">Лампа на таблото</text>
  <text x="140" y="285" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">или липса на мощност</text>
  <!-- Arrow 1 to 2 -->
  <path d="M230 250 L300 250" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <polygon points="300,244 315,250 300,256" fill="#0F766E"/>
  <!-- Step 2 -->
  <rect x="310" y="180" width="180" height="140" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
  <circle cx="400" cy="180" r="22" fill="#0F766E"/>
  <text x="400" y="186" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <text x="400" y="235" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Марка и детайл</text>
  <text x="400" y="265" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">Специфичен дефект</text>
  <text x="400" y="285" fill="#64748B" font-family="sans-serif" font-size="12" text-anchor="middle">по конкретен модел</text>
  <!-- Arrow 2 to 3 -->
  <path d="M490 250 L560 250" stroke="#0F766E" stroke-width="4" fill="none"/>
  <polygon points="560,244 575,250 560,256" fill="#0F766E"/>
  <!-- Step 3 -->
  <rect x="570" y="180" width="180" height="140" rx="12" fill="#042F2E" stroke="#14B8A6" stroke-width="3"/>
  <circle cx="660" cy="180" r="22" fill="#14B8A6"/>
  <text x="660" y="186" fill="#042F2E" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  <text x="660" y="235" fill="#5EEAD4" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Точна диагноза</text>
  <text x="660" y="265" fill="#CCFBF1" font-family="sans-serif" font-size="12" text-anchor="middle">Препоръчана услуга</text>
  <text x="660" y="285" fill="#CCFBF1" font-family="sans-serif" font-size="12" text-anchor="middle">&amp; ценова насока</text>
  <!-- Header Title -->
  <text x="400" y="80" fill="#0F172A" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">ИНТЕРАКТИВЕН ДИАГНОСТИЧЕН ПРОЦЕС</text>
  <text x="400" y="110" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle">3 бързи стъпки до установяване на електронната повреда</text>
</svg>
