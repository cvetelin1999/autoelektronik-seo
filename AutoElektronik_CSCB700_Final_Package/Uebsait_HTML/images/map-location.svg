<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#mapBg)"/>
  <!-- Stylized Road Grid for Sofia / Tsarigradsko shose -->
  <path d="M0 250 Q 400 240 800 250" stroke="#FFFFFF" stroke-width="32" fill="none"/>
  <path d="M0 250 Q 400 240 800 250" stroke="#F59E0B" stroke-width="4" stroke-dasharray="16 16" fill="none"/>
  <path d="M400 0 L 400 500" stroke="#FFFFFF" stroke-width="24" fill="none"/>
  <path d="M150 100 L 650 400" stroke="#FFFFFF" stroke-width="16" fill="none"/>
  <text x="600" y="235" fill="#475569" font-family="sans-serif" font-size="14" font-weight="bold">бул. „Цариградско шосе“</text>
  <!-- Pin Marker for Service Location -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="-45" r="28" fill="#EF4444" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M-20 -35 L 0 0 L 20 -35 Z" fill="#EF4444"/>
    <circle cx="0" cy="-45" r="12" fill="#FFFFFF"/>
    <!-- Ripple / Pulse -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Location Card Overlay -->
  <rect x="220" y="320" width="360" height="110" rx="16" fill="#0F172A" opacity="0.95"/>
  <text x="400" y="355" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AutoElektronik Сервиз</text>
  <text x="400" y="380" fill="#2DD4BF" font-family="sans-serif" font-size="13" text-anchor="middle">бул. „Цариградско шосе“ №115, гр. София</text>
  <text x="400" y="405" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">GPS: 42.6617° N, 23.3853° E | Удобен паркинг за клиенти</text>
</svg>
