<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgLab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgLab)"/>
  <!-- ESD Antistatic Workbench Surface -->
  <rect x="80" y="240" width="640" height="180" rx="12" fill="#0E7490" stroke="#155E75" stroke-width="4"/>
  <!-- Microscope for Micro-soldering -->
  <rect x="360" y="90" width="80" height="30" rx="4" fill="#64748B"/>
  <rect x="390" y="120" width="20" height="90" fill="#475569"/>
  <polygon points="380,210 420,210 430,230 370,230" fill="#334155"/>
  <circle cx="400" cy="245" r="18" fill="#F8FAFC" stroke="#0F766E" stroke-width="3"/>
  <!-- JBC Precision Soldering Station -->
  <rect x="140" y="150" width="120" height="80" rx="8" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
  <rect x="155" y="165" width="50" height="30" rx="4" fill="#042F2E"/>
  <text x="180" y="185" fill="#2DD4BF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">350°C</text>
  <line x1="230" y1="210" x2="280" y2="260" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Automotive Module on Test Rig -->
  <rect x="320" y="260" width="160" height="100" rx="8" fill="#020617" stroke="#14B8A6" stroke-width="2"/>
  <!-- Rigol Digital Storage Oscilloscope -->
  <rect x="520" y="130" width="160" height="100" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <rect x="535" y="145" width="90" height="60" rx="4" fill="#042F2E"/>
  <path d="M540 175 Q 560 155 580 175 T 620 175" fill="none" stroke="#FCD34D" stroke-width="2"/>
  <!-- Lab Title Banner -->
  <rect x="220" y="435" width="360" height="40" rx="20" fill="#0F766E"/>
  <text x="400" y="460" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ЛАБОРАТОРНО СЕРВИЗНО ОБОРУДВАНЕ</text>
</svg>
